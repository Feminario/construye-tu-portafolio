<title>Tu Sesión de Portafolio con Feminario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>

  :root{
    /* Colores oficiales — Feminario_ManualDeIdentidad.pdf, sección "Colores Corporativos" */
    --morado: #7E84AE;
    --periwinkle: #C2CBFF;
    --lavanda: #CEA2DD;
    --verde: #DFF3AF;
    /* Derivados del morado de marca, para texto y fondos (el manual no define estos, se derivan por contraste) */
    --morado-oscuro: #4C4F68;
    --morado-suave: #9AA0C7;
    --crema: #F8F7F2;
    --blanco: #FFFFFF;
    --texto: #3A3550;
    --bien: #3E8F63;
    --alerta: #B24A72;
    --vidrio: rgba(255,255,255,0.68);
    --vidrio-borde: rgba(255,255,255,0.55);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--crema);
    color: var(--texto);
    min-height: 100vh;
    line-height: 1.55;
    position: relative;
    overflow-x: hidden;
  }
  /* ---- Fondo "liquid": manchas grandes difuminadas en los colores de marca ---- */
  .blob{ position: fixed; border-radius: 50%; filter: blur(60px); z-index:-1; opacity:.55; }
  .blob-1{ width: 520px; height: 520px; background: var(--periwinkle); top: -180px; left: -160px; }
  .blob-2{ width: 460px; height: 460px; background: var(--lavanda); top: 30%; right: -220px; opacity:.45; }
  .blob-3{ width: 420px; height: 420px; background: var(--verde); bottom: -180px; left: -140px; opacity:.4; }
  .blob-4{ width: 300px; height: 300px; background: var(--morado); bottom: 10%; right: -120px; opacity:.18; }

  #app{ max-width: 600px; margin: 0 auto; padding: 32px 18px 60px; position:relative; }

  .brand-header{ display:flex; align-items:center; justify-content:center; margin-bottom: 10px; }
  .brand-icon{ height: 52px; width:auto; display:block; }
  .titulo-tool{ text-align:center; font-size: 25px; font-weight: 800; color: var(--morado-oscuro); margin: 0 0 24px; letter-spacing:-0.3px; }

  .card{
    background: var(--vidrio);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid var(--vidrio-borde);
    border-radius: 30px; padding: 28px 24px;
    box-shadow: 0 20px 50px rgba(76,79,104,0.16), 0 2px 8px rgba(76,79,104,0.06);
    margin-bottom: 18px;
  }
  h2{ color: var(--morado-oscuro); font-size: 22px; margin-top:0; font-weight:800; letter-spacing:-0.2px; }
  h3{ color: var(--morado); font-size: 16px; margin-bottom: 8px; font-weight:800; }
  p{ margin: 0 0 14px; }
  .lead{ font-size: 15.5px; }
  .microcopy{ font-size:13px; color:var(--morado-oscuro); background: rgba(194,203,255,0.35); border-radius:14px; padding:12px 16px; margin: 0 0 18px; }

  label{ display:block; font-weight: 700; font-size: 13.5px; color: var(--morado-oscuro); margin: 16px 0 6px; }
  label.sublabel{ margin: 12px 0 4px; font-size:12.5px; }
  input[type="text"], input[type="number"], input[type="email"], select{
    width:100%; padding: 13px 16px; border-radius: 16px; border: 1.5px solid rgba(126,132,174,0.28);
    font-size: 15px; background: rgba(255,255,255,0.85); font-family: inherit; color: var(--texto);
  }
  input:focus, select:focus{ outline: none; border-color: var(--morado); box-shadow: 0 0 0 3px rgba(126,132,174,0.18); }
  small.help{ display:block; color:var(--morado-suave); font-size:12.5px; margin-top:6px; }

  .btn{
    display:inline-block; width:100%; text-align:center;
    background: linear-gradient(135deg, var(--morado), #8f8bc4);
    color: #fff; border:none; padding: 16px 18px; border-radius: 999px; font-size: 15.5px; font-weight: 700;
    cursor:pointer; margin-top: 22px; transition: transform .12s, box-shadow .15s;
    text-decoration:none; font-family: inherit; box-shadow: 0 10px 24px rgba(126,132,174,0.4);
  }
  .btn:hover{ transform: translateY(-1px); box-shadow: 0 14px 28px rgba(126,132,174,0.5); }
  .btn:active{ transform: scale(0.98); }
  .btn.secundario{ background: rgba(126,132,174,0.12); color: var(--morado-oscuro); box-shadow:none; border: 1.5px solid rgba(126,132,174,0.3); }
  .btn.secundario:hover{ background: rgba(126,132,174,0.2); transform:none; }
  .btn.chico{ padding:11px 16px; font-size:13.5px; margin-top:12px; }
  .btn[disabled]{ opacity:0.5; cursor:not-allowed; }

  .pregunta-bloque{ margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px solid rgba(126,132,174,0.15); }
  .pregunta-bloque:last-of-type{ border-bottom:none; }
  .pregunta-texto{ font-weight:800; font-size:15px; color:var(--morado-oscuro); margin-bottom:10px; }
  .opciones{ display:flex; flex-direction:column; gap:9px; }
  .opcion{ border:1.5px solid rgba(126,132,174,0.25); border-radius:16px; padding:13px 16px; cursor:pointer; font-size:14.5px; transition: all .15s; background: rgba(255,255,255,0.5); }
  .opcion:hover{ border-color: var(--morado); }
  .opcion.sel{ border-color: var(--morado); background: linear-gradient(135deg, rgba(194,203,255,0.55), rgba(206,162,221,0.4)); font-weight:700; color:var(--morado-oscuro); }

  .cat-group{ margin-bottom: 6px; padding: 16px 0; border-bottom: 1px solid rgba(126,132,174,0.15); }
  .cat-group:last-child{ border-bottom:none; }
  .cat-titulo{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:14.5px; color:var(--morado-oscuro); }
  .cat-swatch{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .cat-help{ font-size:13px; color:var(--morado-suave); margin: 4px 0 10px; }

  .tasa-box{ background: rgba(223,243,175,0.35); border-radius: 18px; padding: 16px 18px; margin-bottom: 18px; }
  .tasa-box label{ margin-top:0; }
  .tasa-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tasa-grid label{ font-size:12.5px; margin:0 0 4px; }

  /* Lista de montos con moneda (COP/USD/EUR), varias filas por categoría */
  .monto-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .monto-input{ flex:2; min-width:0; }
  .moneda-select{ flex:1; min-width:74px; padding:13px 8px; }
  .monto-del{ background:none; border:none; color:var(--alerta); font-size:18px; line-height:1; cursor:pointer; padding:6px; flex-shrink:0; }

  /* Holdings de inversión de mercado */
  .holding-row{ background: rgba(255,255,255,0.55); border-radius:18px; padding:14px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px; }
  .holding-ticker{ width:100%; }
  .holding-tipo{ width:100%; }
  .holding-del{ align-self:flex-start; background:none; border:none; color:var(--alerta); font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; padding:0; }

  .paso-nota{ text-align:center; font-size:12.5px; color:var(--morado-suave); margin: 6px 0 0; }
  .progreso{ margin-top: 22px; }
  .paso-dots{ display:flex; justify-content:center; gap:6px; margin-bottom:8px; }
  .paso-dot{ width:8px; height:8px; border-radius:50%; background: rgba(126,132,174,0.22); }
  .paso-dot.activo{ background: var(--morado); }
  .paso-texto{ text-align:center; font-size:12px; color:var(--morado-suave); }

  /* Resultado */
  .patrimonio-hero{
    text-align:center; background: linear-gradient(135deg, rgba(194,203,255,0.55), rgba(206,162,221,0.5));
    border-radius: 24px; padding: 26px 20px; margin-bottom:16px; position:relative; overflow:hidden;
  }
  .patrimonio-hero .rotulo{ font-size:12.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--morado-oscuro); font-weight:700; }
  .patrimonio-hero .monto{ font-size:36px; font-weight:800; color:var(--morado-oscuro); margin: 6px 0; letter-spacing:-0.5px; }
  .patrimonio-hero .desglose{ font-size:13.5px; color:var(--morado-oscuro); opacity:.75; }

  .stack-bar{ display:flex; width:100%; height:40px; border-radius:14px; overflow:hidden; background:rgba(126,132,174,0.12); }
  .stack-seg{ display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:800;
    white-space:nowrap; overflow:hidden; border-right: 2px solid rgba(255,255,255,0.7); }
  .stack-seg:last-child{ border-right:none; }
  .legend{ margin-top:14px; display:flex; flex-direction:column; gap:9px; }
  .legend-item{ display:flex; align-items:center; gap:10px; font-size:13.5px; }
  .legend-swatch{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .legend-label{ flex:1; color:var(--morado-oscuro); font-weight:600; }
  .legend-val{ color:var(--morado-suave); font-weight:700; white-space:nowrap; }
  .holdings-resumen{ font-size:13px; color:var(--morado-oscuro); background: rgba(255,255,255,0.5); border-radius:14px; padding:12px 16px; margin-top:12px; }

  .perfil-card{ background: linear-gradient(135deg, rgba(206,162,221,0.55), rgba(194,203,255,0.4)); border-radius: 22px; padding: 22px; margin: 18px 0; }
  .perfil-nombre{ font-size:19px; font-weight:800; color:var(--morado-oscuro); margin-bottom:6px; }
  .meta-card{ background: rgba(223,243,175,0.4); border-radius:16px; padding:14px 18px; margin: 14px 0; font-size:14px; }
  .meta-card b{ color:var(--morado-oscuro); }

  .arquetipo-card{
    background: linear-gradient(135deg, rgba(194,203,255,0.6), rgba(206,162,221,0.45));
    border-radius: 22px; padding: 22px; margin: 18px 0;
  }
  .arquetipo-nombre{ font-size:20px; font-weight:800; color:var(--morado-oscuro); margin-bottom:6px; }

  .coherencia-box{ border-radius:18px; padding:18px 20px; margin:16px 0; font-size:14px; }
  .coherencia-ok{ background: rgba(62,143,99,0.12); border: 1px solid rgba(62,143,99,0.35); }
  .coherencia-alerta{ background: rgba(178,74,114,0.1); border: 1px solid rgba(178,74,114,0.35); }
  .coherencia-titulo{ font-weight:800; font-size:15px; color:var(--morado-oscuro); margin-bottom:6px; }

  .tip{
    background: rgba(255,255,255,0.55); border-radius: 16px;
    padding: 13px 16px; margin-bottom: 10px; font-size: 14px; color: var(--morado-oscuro);
    border-left: 4px solid var(--morado);
  }

  .comparativo{ background: rgba(255,255,255,0.5); border-radius:18px; padding:18px 20px; margin: 16px 0; }
  .comparativo .fila{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px; }
  .comparativo .fila b{ color:var(--morado-oscuro); }
  .sube{ color: var(--bien); font-weight:800; }
  .baja{ color: var(--alerta); font-weight:800; }
  .sparkline-wrap{ text-align:center; margin-top:10px; }

  .explorar{ background: linear-gradient(135deg, rgba(126,132,174,0.16), rgba(206,162,221,0.28)); border-radius: 24px; padding: 24px 22px; margin-top: 12px; }
  .explorar h3{ color: var(--morado-oscuro); }
  .explorar p{ color: var(--morado-oscuro); font-size:14px; opacity:.85; }

  .footer-nota{ text-align:center; font-size: 12px; color: var(--morado-suave); margin-top: 22px; line-height:1.5; }
  .link-volver{ display:block; width:100%; text-align:center; margin-top:14px; font-size:13.5px; color:var(--morado); cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font-family:inherit; }


  :root{
    --morado: #7E84AE;
    --periwinkle: #C2CBFF;
    --lavanda: #CEA2DD;
    --verde: #DFF3AF;
    --morado-oscuro: #4C4F68;
    --morado-suave: #9AA0C7;
    --crema: #F8F7F2;
    --superficie: #FFFFFF;
    --texto: #3A3550;
    --texto-suave: #6b6684;
    --bien: #3E8F63;
    --alerta: #B24A72;
    --vidrio: rgba(255,255,255,0.68);
    --vidrio-borde: rgba(255,255,255,0.6);
    --raices: #B08968;
    --tronco: #7E84AE;
    --ramas: #C2483D;
    --agua: #5A9BD5;
    --injerto: #CEA2DD;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --crema: #221f2e;
      --superficie: #2b2739;
      --texto: #ECE9F5;
      --texto-suave: #B6B0CC;
      --morado-oscuro: #E4E1F5;
      --morado-suave: #A9A3C9;
      --vidrio: rgba(255,255,255,0.06);
      --vidrio-borde: rgba(255,255,255,0.12);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --crema: #221f2e;
    --superficie: #2b2739;
    --texto: #ECE9F5;
    --texto-suave: #B6B0CC;
    --morado-oscuro: #E4E1F5;
    --morado-suave: #A9A3C9;
    --vidrio: rgba(255,255,255,0.06);
    --vidrio-borde: rgba(255,255,255,0.12);
    color-scheme: dark;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background:var(--crema); color:var(--texto); line-height:1.55;
  }
  #blobs{ position:fixed; inset:0; z-index:-1; overflow:hidden; }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.35; }
  .blob-1{ width:480px; height:480px; background:var(--periwinkle); top:-160px; left:-140px; }
  .blob-2{ width:420px; height:420px; background:var(--lavanda); top:20%; right:-200px; opacity:.28; }
  .blob-3{ width:380px; height:380px; background:var(--verde); bottom:-160px; left:-120px; opacity:.25; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .blob{ opacity:.12; } }
  :root[data-theme="dark"] .blob{ opacity:.12; }

  #app{ max-width:600px; margin:0 auto; padding: max(28px, env(safe-area-inset-top,0px)) 18px 60px; }
  .brand{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px; }
  .brand img{ height:40px; width:auto; }
  .eyebrow{ text-align:center; font-size:12.5px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--morado-suave); margin-bottom:4px; }
  .titulo-tool{ text-align:center; font-size:24px; font-weight:800; color:var(--morado-oscuro); margin:0 0 22px; letter-spacing:-0.3px; }

  .card{
    background:var(--vidrio); -webkit-backdrop-filter:blur(22px) saturate(1.3); backdrop-filter:blur(22px) saturate(1.3);
    border:1px solid var(--vidrio-borde); border-radius:26px; padding:26px 22px; margin-bottom:16px;
    box-shadow:0 16px 40px rgba(76,79,104,0.12), 0 2px 8px rgba(76,79,104,0.05);
  }
  h2{ color:var(--morado-oscuro); font-size:21px; margin:0 0 10px; font-weight:800; letter-spacing:-0.2px; text-wrap:balance; }
  h3{ color:var(--morado); font-size:15px; margin:18px 0 8px; font-weight:800; }
  p{ margin:0 0 12px; }
  .lead{ font-size:15px; color:var(--texto-suave); }
  small.help{ display:block; color:var(--morado-suave); font-size:12.5px; margin-top:6px; }

  label{ display:block; font-weight:700; font-size:13.5px; color:var(--morado-oscuro); margin:14px 0 6px; }
  input[type="text"], input[type="email"], input[type="number"]{
    width:100%; padding:13px 16px; border-radius:16px; border:1.5px solid rgba(126,132,174,0.28);
    font-size:15px; background:var(--superficie); font-family:inherit; color:var(--texto);
  }
  input:focus{ outline:none; border-color:var(--morado); box-shadow:0 0 0 3px rgba(126,132,174,0.18); }
  textarea{
    width:100%; padding:13px 16px; border-radius:16px; border:1.5px solid rgba(126,132,174,0.28);
    font-size:14.5px; background:var(--superficie); font-family:inherit; color:var(--texto); resize:vertical; min-height:70px;
  }

  .btn{
    display:inline-block; width:100%; text-align:center; background:linear-gradient(135deg, var(--morado), #8f8bc4);
    color:#fff; border:none; padding:15px 18px; border-radius:999px; font-size:15px; font-weight:700;
    cursor:pointer; margin-top:18px; box-shadow:0 10px 24px rgba(126,132,174,0.35); font-family:inherit;
  }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.secundario{ background:rgba(126,132,174,0.12); color:var(--morado-oscuro); box-shadow:none; border:1.5px solid rgba(126,132,174,0.3); }
  .link-volver{ display:block; width:100%; text-align:center; margin-top:12px; font-size:13.5px; color:var(--morado); cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font-family:inherit; }

  .opciones{ display:flex; flex-direction:column; gap:8px; }
  .opcion{ border:1.5px solid rgba(126,132,174,0.25); border-radius:15px; padding:12px 15px; cursor:pointer; font-size:14px; background:var(--superficie); }
  .opcion.sel{ border-color:var(--morado); background:linear-gradient(135deg, rgba(194,203,255,0.5), rgba(206,162,221,0.35)); font-weight:700; color:var(--morado-oscuro); }
  :root[data-theme="dark"] .opcion.sel, @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .opcion.sel{ background:linear-gradient(135deg, rgba(194,203,255,0.16), rgba(206,162,221,0.12)); } }

  .resumen-row{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid rgba(126,132,174,0.15); font-size:14px; }
  .resumen-row:last-child{ border-bottom:none; }
  .resumen-row .k{ color:var(--texto-suave); }
  .resumen-row .v{ font-weight:700; color:var(--morado-oscuro); text-align:right; }

  .split-bar{ display:flex; width:100%; height:34px; border-radius:12px; overflow:hidden; background:rgba(126,132,174,0.12); margin:10px 0; }
  .split-seg{ display:flex; align-items:center; justify-content:center; color:#fff; font-size:11.5px; font-weight:800; white-space:nowrap; overflow:hidden; }
  .split-legend{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--texto-suave); margin-top:2px; }

  .jardin-list{ display:flex; flex-direction:column; gap:8px; margin:10px 0 4px; }
  .jardin-item{ display:flex; align-items:center; gap:10px; background:var(--superficie); border-radius:14px; padding:10px 13px; font-size:13.5px; }
  .jardin-swatch{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .jardin-label{ flex:1; font-weight:700; color:var(--morado-oscuro); }
  .jardin-val{ color:var(--texto-suave); font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }

  table.matriz{ width:100%; border-collapse:collapse; font-size:12.5px; margin:10px 0; }
  table.matriz th, table.matriz td{ padding:8px 6px; text-align:center; border-bottom:1px solid rgba(126,132,174,0.15); }
  table.matriz th{ color:var(--morado-suave); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  table.matriz td.horiz{ text-align:left; color:var(--texto-suave); }
  table.matriz tr.fila-activa td{ background:linear-gradient(135deg, rgba(194,203,255,0.5), rgba(206,162,221,0.35)); font-weight:800; color:var(--morado-oscuro); border-radius:8px; }
  :root[data-theme="dark"] table.matriz tr.fila-activa td, @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) table.matriz tr.fila-activa td{ background:linear-gradient(135deg, rgba(194,203,255,0.16), rgba(206,162,221,0.12)); } }
  .matriz-wrap{ overflow-x:auto; }

  .rango-box{ background:rgba(223,243,175,0.35); border-radius:18px; padding:16px 18px; margin:14px 0; }
  :root[data-theme="dark"] .rango-box, @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .rango-box{ background:rgba(223,243,175,0.08); } }
  .rango-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .rango-grid label{ font-size:12px; margin:0 0 4px; }
  .suma-check{ text-align:center; font-size:13px; font-weight:700; margin-top:10px; padding:8px; border-radius:10px; }
  .suma-ok{ background:rgba(62,143,99,0.15); color:var(--bien); }
  .suma-mal{ background:rgba(178,74,114,0.12); color:var(--alerta); }

  .microcopy{ font-size:13px; color:var(--morado-oscuro); background:rgba(194,203,255,0.35); border-radius:14px; padding:12px 16px; margin:0 0 16px; }

async function fetchDatosLive(email){
  if(!SHEET_WEBAPP_URL) return null;
  const url = SHEET_WEBAPP_URL + "?email=" + encodeURIComponent(email);
  const res = await fetch(url, { method:"GET" });
  if(!res.ok) return null;
  const data = await res.json();
  if(!data || !data.ok) return null;
  return data; // { ok, balance, rango_s1, vehiculo_s2 }
}

function calcularPerfilRiesgo(respuestas){
  const score = Object.values(respuestas).reduce((a,b)=>a+n(b), 0);
  let categoria, descripcion;
  if(score <= 12){
    categoria = "Conservadora";
    descripcion = "Prefieres proteger lo que tienes antes que arriesgarte a que crezca mucho. No hay nada de malo en eso — solo hay que asegurarse de que no sea tan conservador que la inflación se coma tu plata en silencio.";
  } else if(score <= 18){
    categoria = "Moderada";
    descripcion = "Buscas un balance: que tu plata crezca, pero sin sustos grandes. Puedes tolerar algo de vaivén si el plan detrás tiene sentido.";
  } else {
    categoria = "Arriesgada";
    descripcion = "Estás dispuesta a ver bajones en el camino con tal de buscar más crecimiento. Ojo: arriesgada no es lo mismo que impulsiva — el riesgo funciona cuando tiene un plan y un colchón detrás.";
  }
  return { score, categoria, descripcion };
}

/* ============================================================
   ESTADO — perfil + historial mensual en localStorage del
   navegador. El respaldo real (para tu información agregada y
   para diseñar las sesiones del curso) vive en tu Google Sheet
   vía SHEET_WEBAPP_URL.
   OJO: el historial mes a mes solo se ve en el mismo navegador/
   dispositivo donde ella llena el formulario. Si abre el link
   desde otro celular, no va a ver su historial anterior en
   pantalla — eso sí queda guardado en tu Sheet, pero no hay
   forma de traerlo de vuelta a la pantalla sin un login real
   (posible fase futura).
   ============================================================ */
const STORAGE_KEY = "fem_balance_portafolio_v4";
function getState(){ try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function saveState(state){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function enviarABaseDeDatos(payload){
  if(!SHEET_WEBAPP_URL){ console.log("[Balance de Portafolio] Sin SHEET_WEBAPP_URL configurada. Datos solo guardados localmente:", payload); return; }
  fetch(SHEET_WEBAPP_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(payload) })
    .catch(err => console.log("[Balance de Portafolio] Error al enviar a la base de datos:", err));
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function n(v){ return Number(v) || 0; }
function cop(v){ v = Number(v) || 0; const signo = v < 0 ? "-" : ""; return signo + "$" + Math.round(Math.abs(v)).toLocaleString("es-CO"); }
function pct(v){ return Math.round(v*100); }
function esc(s){ return (s || "").toString().replace(/"/g, "&quot;"); }
function alertaSuave(msg){
  const el = document.createElement("div");
  el.textContent = msg;
  el.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#4C4F68;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:99;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.25);";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

function progreso(paso, total){

}

/* ============================================================
   MONEDA — cada categoría de plata puede tener varios montos en
   distintas monedas a la vez (ej: parte de tu Fondo de Autonomía
   en pesos y otra parte en dólares). Guardamos una lista de
   {monto, moneda} por categoría y convertimos todo a COP con las
   tasas que ella misma define, solo para poder sumar y sacar
   porcentajes. Sus valores originales quedan intactos.
   ============================================================ */
let draftListas = {};
function entradaVacia(){ return { monto:"", moneda:"COP" }; }
function inicializarLista(id){
  draftListas[id] = (draft[id] && draft[id].length) ? draft[id].map(e=>({...e})) : [entradaVacia()];
}
function renderListaMonto(id, placeholder){
  const entradas = draftListas[id] && draftListas[id].length ? draftListas[id] : [entradaVacia()];
  return `<div id="lista-${id}">
    ${entradas.map((e,i) => `
      <div class="monto-row">
        <input type="number" class="monto-input" placeholder="${placeholder||'0'}" value="${e.monto||''}" oninput="draftListas['${id}'][${i}].monto=this.value">
        <select class="moneda-select" onchange="draftListas['${id}'][${i}].moneda=this.value">
          ${MONEDAS.map(m => `<option value="${m}" ${e.moneda===m?'selected':''}>${m}</option>`).join("")}
        </select>
        ${entradas.length>1 ? `<button type="button" class="monto-del" onclick="quitarEntradaLista('${id}',${i})" aria-label="Quitar">✕</button>` : ""}
      </div>
    `).join("")}
    <button type="button" class="btn secundario chico" onclick="agregarEntradaLista('${id}')">+ Agregar otro monto</button>
  </div>`;
}
function agregarEntradaLista(id){
  draftListas[id].push(entradaVacia());
  document.getElementById("lista-"+id).outerHTML = renderListaMonto(id);
}
function quitarEntradaLista(id, i){
  draftListas[id].splice(i,1);
  if(draftListas[id].length===0) draftListas[id] = [entradaVacia()];
  document.getElementById("lista-"+id).outerHTML = renderListaMonto(id);
}
function leerLista(id){
  return (draftListas[id]||[]).filter(e => n(e.monto) > 0).map(e => ({ monto: n(e.monto), moneda: e.moneda || "COP" }));
}
function enCop(entrada, tasas){
  if(!entrada) return 0;
  const monto = n(entrada.monto);
  if(entrada.moneda === "USD") return monto * n(tasas.usd);
  if(entrada.moneda === "EUR") return monto * n(tasas.eur);
  return monto;
}
function sumaListaCop(lista, tasas){ return (lista||[]).reduce((s,e) => s + enCop(e, tasas), 0); }
function formatoMonto(e){
  const val = Math.round(n(e.monto)).toLocaleString("es-CO");
  if(e.moneda === "USD") return "US$" + val;
  if(e.moneda === "EUR") return "€" + val;
  return "$" + val;
}
function detalleLista(lista){ return (lista||[]).filter(e => n(e.monto) > 0).map(formatoMonto).join(" + "); }

/* ============================================================
   CÁLCULO DE PORTAFOLIO — arma el snapshot del mes con activos,
   pasivos, patrimonio neto, meses de colchón, apalancamiento,
   concentración y el arquetipo de balance/diversificación.
   Todos los valores se convierten a COP con las tasas indicadas
   para poder sumarlos; el detalle original (montos y monedas
   por separado) se guarda en snapshot.raw para el próximo corte
   y para el export a tu Excel.
   ============================================================ */
function calcularSnapshot(draft, tasas){
  tasas = { usd: n(tasas.usd) || 4000, eur: n(tasas.eur) || 4300 };
  const activos = {
    liquidez: sumaListaCop(draft.liquidez, tasas),
    rentaFija: sumaListaCop(draft.rentaFija, tasas),
    pension: sumaListaCop(draft.pension, tasas),
    vivienda: sumaListaCop(draft.viviendaPropia, tasas) + sumaListaCop(draft.viviendaInversion, tasas),
    mercado: (draft.mercadoHoldings||[]).reduce((s,h)=> s + enCop(h, tasas), 0),
    negocio: sumaListaCop(draft.negocio, tasas),
    otros: sumaListaCop(draft.vehiculo, tasas) + sumaListaCop(draft.otrosActivos, tasas),
  };
  const activosDetalle = {
    viviendaPropia: sumaListaCop(draft.viviendaPropia, tasas), viviendaInversion: sumaListaCop(draft.viviendaInversion, tasas),
    vehiculo: sumaListaCop(draft.vehiculo, tasas), otrosActivos: sumaListaCop(draft.otrosActivos, tasas),
  };
  const pasivos = {};
  DEBT_CATS.forEach(c => pasivos[c.key] = sumaListaCop(draft[c.key], tasas));
  const gastoMensual = sumaListaCop(draft.gastoMensual, tasas);

  const totalActivos = Object.values(activos).reduce((a,b)=>a+b, 0);
  const totalPasivos = Object.values(pasivos).reduce((a,b)=>a+b, 0);
  const patrimonioNeto = totalActivos - totalPasivos;
  const mesesColchon = gastoMensual > 0 ? Math.round((activos.liquidez / gastoMensual)*10)/10 : 0;
  const relacionDeudaActivos = totalActivos > 0 ? totalPasivos/totalActivos : (totalPasivos>0 ? 1 : 0);

  let maxCat = null, maxPct = 0;
  ASSET_CATS.forEach(cat=>{
    const p = totalActivos>0 ? activos[cat.key]/totalActivos : 0;
    if(p > maxPct){ maxPct = p; maxCat = cat.key; }
  });
  const bucketsConPresencia = ASSET_CATS.filter(cat => totalActivos>0 && (activos[cat.key]/totalActivos) >= 0.05).length;
  const sinLargoPlazo = (activos.pension + activos.mercado) <= 0;

  let arquetipo, mensaje, tips = [];

  if(totalActivos <= 0 && totalPasivos <= 0){
    arquetipo = "La Que Empieza Desde Cero";
    mensaje = "Hoy no tienes activos registrados todavía — y está bien. Este primer corte es tu línea base: todo lo que venga de aquí en adelante ya es progreso que vas a poder medir.";
    tips = [
      "Tu primer paso no es invertir, es armar tu Fondo de Autonomía, aunque sea con " + cop(20000) + " esta semana.",
      "Vuelve a hacer este corte el próximo mes — la comparación es lo que te va a mostrar que sí estás avanzando."
    ];
  } else if(gastoMensual > 0 && mesesColchon < 1){
    arquetipo = "La Sin Red de Seguridad";
    mensaje = `Tienes ${cop(patrimonioNeto)} de patrimonio neto, pero solo ${mesesColchon} meses de colchón. Así tengas otras cosas (vivienda, pensión, inversión), si hoy te quedas sin ingreso no tienes con qué cubrir lo básico sin vender algo o endeudarte.`;
    tips = [
      `Antes de meterle más a inversión o a pagar deuda extra, prioriza juntar al menos 1 mes de gastos (${cop(gastoMensual)}) en liquidez inmediata.`,
      "Revisa si alguno de tus otros activos (un CDT que ya cumplió plazo, por ejemplo) puede pasar a liquidez sin perder mucho."
    ];
  } else if(maxPct >= 0.7 && maxCat === "vivienda"){
    arquetipo = "La Casa-Fuerte";
    mensaje = `El ${pct(maxPct)}% de tu patrimonio está en vivienda. Es un activo real y valioso, pero no es líquido: no lo puedes usar rápido si necesitas plata ya.`;
    tips = [
      "Como tu colchón está cubierto, el siguiente paso es empezar a construir algo líquido o de mercado por fuera del ladrillo, así no dependes de vender o hipotecar la casa ante un imprevisto.",
      "Con el tiempo, ninguna categoría debería pesar más del 60-70% de tu patrimonio — ni siquiera la vivienda."
    ];
  } else if(maxPct >= 0.7 && (maxCat === "liquidez" || maxCat === "rentaFija")){
    arquetipo = "La Guardiana Cautelosa";
    mensaje = `El ${pct(maxPct)}% de tu patrimonio está en efectivo o CDT. Tu plata está segura, pero una parte importante no está creciendo a largo plazo.`;
    tips = [
      "Con tu colchón ya cubierto, destina un % fijo de lo nuevo que ahorres a pensión voluntaria o a un fondo de inversión, así ese dinero también trabaja para ti.",
      "No se trata de mover todo de golpe: empieza con un monto pequeño y constante cada mes."
    ];
  } else if(relacionDeudaActivos >= 0.4){
    arquetipo = "La Apalancada";
    mensaje = `Tu deuda equivale al ${pct(relacionDeudaActivos)}% de todo lo que tienes. Antes de pensar en invertir más, vale la pena mirar si esa deuda te está costando más de lo que te está rindiendo cualquier otra cosa.`;
    tips = [
      "Identifica cuál de tus deudas tiene la tasa más alta (usualmente la tarjeta de crédito) y ponla de primera en tu plan de pago.",
      "Si tu deuda es sobre todo hipotecaria con una tasa razonable, no es urgente — el problema real es la deuda cara de consumo, no toda deuda por igual."
    ];
  } else if(sinLargoPlazo && mesesColchon >= 3){
    arquetipo = "La Segura de Hoy, Corta de Mañana";
    mensaje = "Tu día a día está bien cubierto: tienes colchón y no estás endeudada de más. Pero no tienes nada en pensión voluntaria ni en mercado — nada está creciendo pensando en los próximos 10 o 20 años.";
    tips = [
      "Aunque sea un monto pequeño y constante, empezar hoy en pensión voluntaria o en un fondo de inversión le da tiempo al interés compuesto, que es lo que realmente hace la diferencia.",
      "No necesitas saber de mercados para empezar — necesitas empezar para aprender."
    ];
  } else if(bucketsConPresencia >= 4 && mesesColchon >= 3 && relacionDeudaActivos < 0.4 && maxPct < 0.6){
    arquetipo = "La Estratega Diversificada";
    mensaje = "Tu patrimonio está repartido en varios frentes, tu colchón está en un buen rango y tu deuda no te está ahogando. Esto no significa que ya no hay nada que mejorar, pero sí que tienes una base sólida.";
    tips = [
      "El siguiente nivel ya no es \"tener de todo\" — es revisar si cada parte está en su mejor versión posible (tasas, costos, diversificación dentro de cada categoría).",
      "Repite este corte cada mes: a este nivel, lo que importa es mantener el balance, no solo haberlo logrado una vez."
    ];
  } else {
    arquetipo = "La Que Va Armando el Rompecabezas";
    mensaje = "Ya tienes varias piezas puestas — no estás empezando de cero, pero tampoco está todo balanceado todavía. Vamos por partes.";
    const candidatos = [];
    if(gastoMensual > 0 && mesesColchon < 3) candidatos.push(`Tu colchón está en ${mesesColchon} meses — la meta recomendada es 3 a 6. Eso va primero.`);
    if(sinLargoPlazo) candidatos.push("No tienes nada en pensión voluntaria ni en mercado — es tu oportunidad de crecimiento a más largo plazo.");
    if(maxPct >= 0.5) candidatos.push(`El ${pct(maxPct)}% de tu patrimonio está concentrado en una sola categoría — vale la pena repartir un poco más.`);
    if(relacionDeudaActivos >= 0.25) candidatos.push(`Tu deuda equivale al ${pct(relacionDeudaActivos)}% de tus activos — no es crítico, pero mantenla vigilada.`);
    if(candidatos.length === 0) candidatos.push("Vas bien encaminada — sigue sumando un poco cada mes a las categorías donde tienes menos.");
    tips = candidatos.slice(0,2);
  }

  const raw = {
    liquidez: draft.liquidez, rentaFija: draft.rentaFija, pension: draft.pension,
    viviendaPropia: draft.viviendaPropia, viviendaInversion: draft.viviendaInversion,
    mercadoHoldings: draft.mercadoHoldings || [],
    negocio: draft.negocio, vehiculo: draft.vehiculo, otrosActivos: draft.otrosActivos,
    tarjetas: draft.tarjetas, hipotecario: draft.hipotecario, vehiculoCredito: draft.vehiculoCredito,
    personales: draft.personales, educativo: draft.educativo, informal: draft.informal, otrasDeudas: draft.otrasDeudas,
    gastoMensual: draft.gastoMensual, tasaUSD: tasas.usd, tasaEUR: tasas.eur
  };

  return {
    fecha: new Date().toISOString(),
    tasaUSD: tasas.usd, tasaEUR: tasas.eur, raw,
    gastoMensual,
    activos, activosDetalle, pasivos,
    totales: { totalActivos, totalPasivos, patrimonioNeto },
    mesesColchon, relacionDeudaActivos,
    concentracion: { categoria: maxCat, porcentaje: maxPct },
    bucketsConPresencia,
    arquetipo, mensaje, tips
  };
}

/* ============================================================
   COHERENCIA — cruza perfil de riesgo + meta con la composición
   real del portafolio. Este es el segundo diagnóstico (distinto
   del balance/diversificación): no pregunta "¿está balanceado?"
   sino "¿esto tiene sentido para lo que ella dijo que quiere y
   tolera?".
   ============================================================ */
function evaluarCoherencia(perfilRiesgo, metas, activos, totalActivos){
  if(!perfilRiesgo || !metas || totalActivos <= 0) return null;
  const pctMercado = activos.mercado / totalActivos;
  const pctConservador = (activos.liquidez + activos.rentaFija) / totalActivos;
  const pctLargoPlazo = (activos.mercado + activos.pension) / totalActivos;
  const horizonteLargo = metas.horizonte === "Entre 3 y 7 años" || metas.horizonte === "Más de 7 años";
  const horizonteCorto = metas.horizonte === "Menos de 1 año";

  if(perfilRiesgo.categoria === "Conservadora" && pctMercado > 0.4){
    return { estado:"alerta", titulo:"Tu portafolio tiene más riesgo del que dijiste tolerar",
      mensaje:`Te definiste como de perfil <b>conservador</b>, pero el ${pct(pctMercado)}% de tu patrimonio está en inversión de mercado. Si un bajón fuerte te quita el sueño (según lo que respondiste), vale la pena revisar si ese porcentaje es demasiado para ti hoy.` };
  }
  if(horizonteCorto && pctMercado > 0.3){
    return { estado:"alerta", titulo:"Tu meta es de corto plazo, pero tu plata está expuesta al mercado",
      mensaje:`Dijiste que quieres lograr "<b>${esc(metas.principal)}</b>" en menos de 1 año, y el ${pct(pctMercado)}% de tu patrimonio está en inversión de mercado. El riesgo es necesitar esa plata justo cuando el mercado esté en un mal momento.` };
  }
  if((perfilRiesgo.categoria === "Arriesgada" || horizonteLargo) && pctLargoPlazo < 0.15 && pctConservador > 0.6){
    return { estado:"alerta", titulo:"Podrías estar dejando crecimiento sobre la mesa",
      mensaje:`Tu perfil o el horizonte de tu meta permiten buscar más crecimiento, pero el ${pct(pctConservador)}% de tu patrimonio está en efectivo o CDT. Con un horizonte largo, esa plata podría estar trabajando más para ti.` };
  }
  return { estado:"ok", titulo:"Tu portafolio va en línea con tu perfil",
    mensaje:`Para un perfil <b>${perfilRiesgo.categoria.toLowerCase()}</b> y tu meta de "<b>${esc(metas.principal)}</b>", la forma en que tienes repartida tu plata tiene sentido. Eso no quita que revisemos el balance general más abajo — coherente con tu perfil no siempre es lo mismo que bien diversificado.` };
}

/* ============================================================
   COMPONENTES VISUALES — barra apilada de composición, leyenda
   y mini-gráfico de tendencia (línea) para comparar meses.
   ============================================================ */
function renderStackBar(activos, totalActivos){
  if(totalActivos <= 0) return `<div class="stack-bar"></div>`;
  const visibles = ASSET_CATS.filter(cat => activos[cat.key] > 0);
  const segs = visibles.map((cat, i)=>{
    const p = activos[cat.key] / totalActivos;
    const estiloRadio = visibles.length===1 ? "border-radius:14px;" : (i===0 ? "border-radius:14px 0 0 14px;" : (i===visibles.length-1 ? "border-radius:0 14px 14px 0;" : ""));
    return `<div class="stack-seg" style="width:${(p*100).toFixed(2)}%; background:${cat.color}; ${estiloRadio}" title="${cat.label}">${p>=0.12 ? pct(p)+"%" : ""}</div>`;
  }).join("");
  return `<div class="stack-bar">${segs}</div>`;
}
function renderLegend(activos, totalActivos){
  return ASSET_CATS.filter(cat => activos[cat.key] > 0).map(cat=>{
    const p = totalActivos>0 ? activos[cat.key]/totalActivos : 0;
    return `<div class="legend-item">
      <span class="legend-swatch" style="background:${cat.color}"></span>
      <span class="legend-label">${cat.label}</span>
      <span class="legend-val">${cop(activos[cat.key])} · ${pct(p)}%</span>
    </div>`;
  }).join("");
}
function renderHoldingsResumen(snapshot){
  const holdings = (snapshot.raw.mercadoHoldings||[]).filter(h => h.ticker && h.ticker.trim());
  if(holdings.length===0) return "";
  return `<div class="holdings-resumen"><b>Tu inversión de mercado incluye:</b> ${holdings.map(h=>`${esc(h.ticker)} (${esc(h.tipo)})`).join(" · ")}</div>`;
}
function renderSparkline(historial){
  if(historial.length < 2) return "";
  const ultimos = historial.slice(-6);
  const vals = ultimos.map(h => h.totales.patrimonioNeto);
  const w = 260, h = 56, pad = 8;
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const pts = vals.map((v,i)=>{
    const x = pad + i*(w-2*pad)/(vals.length-1);
    const y = h-pad - ((v-min)/range)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const color = vals[vals.length-1] >= vals[0] ? "#3E8F63" : "#B24A72";
  return `<div class="sparkline-wrap"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg><div style="font-size:11.5px;color:var(--morado-suave);">Tu patrimonio neto en tus últimos ${ultimos.length} cortes</div></div>`;
}

/* ============================================================
   EXPORT A GOOGLE SHEET / EXCEL — payload plano, con una columna
   por dato (no un solo JSON en una celda), pensado para que la
   hoja se pueda abrir y analizar directamente en Excel/Drive.
   Cada categoría de plata trae su total en COP más un "_detalle"
   en texto con los montos y monedas originales, por si tenía
   parte en pesos y parte en dólares o euros. Ver
   claude/club365-balance-portafolio.md para el código de Apps
   Script (doPost) que escribe estas columnas en tu Sheet.
   ============================================================ */
function construirPayloadPlano(state, snapshot, coherencia){
  const holdings = (snapshot.raw.mercadoHoldings||[]).filter(h => h.ticker && h.ticker.trim());
  const holdingsTexto = holdings.map(h => `${h.ticker} [${h.tipo}]: ${formatoMonto(h)}`).join(" · ");

  const payload = {
    tipo: "balance_portafolio",
    fecha: snapshot.fecha,
    nombre: state.nombre, email: state.email, whatsapp: state.whatsapp, edad: state.edad,
    perfilRiesgoCategoria: state.perfilRiesgo.categoria, perfilRiesgoScore: state.perfilRiesgo.score,
    metaPrincipal: state.metas.principal, metaHorizonte: state.metas.horizonte,
    metasSecundarias: (state.metas.secundarias||[]).join("; "),
    tasaUSD: snapshot.tasaUSD, tasaEUR: snapshot.tasaEUR,
    activo_mercado_cop: snapshot.activos.mercado,
    activo_mercado_detalle: holdingsTexto,
    totalActivos_cop: snapshot.totales.totalActivos,
    totalPasivos_cop: snapshot.totales.totalPasivos,
    patrimonioNeto_cop: snapshot.totales.patrimonioNeto,
    mesesColchon: snapshot.mesesColchon,
    relacionDeudaActivos: snapshot.relacionDeudaActivos,
    concentracionCategoria: snapshot.concentracion.categoria,
    concentracionPct: snapshot.concentracion.porcentaje,
    arquetipo: snapshot.arquetipo,
    coherenciaEstado: coherencia ? coherencia.estado : "",
    coherenciaTitulo: coherencia ? coherencia.titulo : ""
  };
  const tasas = { usd: snapshot.tasaUSD, eur: snapshot.tasaEUR };
  CAMPOS_SIMPLES.forEach(c => {
    payload[c.pref+"_cop"] = sumaListaCop(snapshot.raw[c.id], tasas);
    payload[c.pref+"_detalle"] = detalleLista(snapshot.raw[c.id]);
  });
  return payload;
}

/* ============================================================
   PANTALLA FINAL — RESULTADO
   ============================================================ */
function pantallaResultado(state, snapshot){
  const historialAnterior = state.historial.length >= 2 ? state.historial[state.historial.length - (state.historial[state.historial.length-1]===snapshot ? 2 : 1)] : null;
  let comparativoHtml = "";
  if(historialAnterior && historialAnterior !== snapshot){
    const deltaPatrimonio = snapshot.totales.patrimonioNeto - historialAnterior.totales.patrimonioNeto;
    const deltaMeses = Math.round((snapshot.mesesColchon - historialAnterior.mesesColchon)*10)/10;
    const fechaAnt = new Date(historialAnterior.fecha).toLocaleDateString("es-CO", { day:"numeric", month:"long" });
    comparativoHtml = `
      <div class="comparativo">
        <h3 style="margin-top:0;">Desde tu corte del ${fechaAnt}</h3>
        <div class="fila"><span>Patrimonio neto</span><b class="${deltaPatrimonio>=0?'sube':'baja'}">${deltaPatrimonio>=0?'+':''}${cop(deltaPatrimonio)}</b></div>
        <div class="fila"><span>Meses de colchón</span><b class="${deltaMeses>=0?'sube':'baja'}">${deltaMeses>=0?'+':''}${deltaMeses}</b></div>
        ${historialAnterior.arquetipo !== snapshot.arquetipo ? `<div class="fila"><span>Tu diagnóstico</span><b>pasó de "${historialAnterior.arquetipo}" a "${snapshot.arquetipo}"</b></div>` : ""}
        ${renderSparkline(state.historial)}
      </div>
    `;
  }

  const coherencia = evaluarCoherencia(state.perfilRiesgo, state.metas, snapshot.activos, snapshot.totales.totalActivos);
  const coherenciaHtml = coherencia ? `
    <h3>¿Tu portafolio va con tu perfil y tu meta?</h3>
    <div class="coherencia-box ${coherencia.estado==='ok'?'coherencia-ok':'coherencia-alerta'}">
      <div class="coherencia-titulo">${coherencia.titulo}</div>
      <p style="margin:0;">${coherencia.mensaje}</p>
    </div>
  ` : "";

  document.getElementById("app").innerHTML = `
    ${headerBalance()}
    <div class="card">
      <div class="perfil-card">
        <div class="perfil-nombre">Perfil de riesgo: ${state.perfilRiesgo.categoria}</div>
        <p style="margin:0;">${state.perfilRiesgo.descripcion}</p>
      </div>
      <div class="meta-card"><b>Tu meta principal:</b> ${esc(state.metas.principal)} · <b>en</b> ${esc(state.metas.horizonte).toLowerCase()}</div>

      <div class="patrimonio-hero">
        <div class="rotulo">Tu patrimonio neto</div>
        <div class="monto">${cop(snapshot.totales.patrimonioNeto)}</div>
        <div class="desglose">${cop(snapshot.totales.totalActivos)} en activos · ${cop(snapshot.totales.totalPasivos)} en deudas</div>
      </div>

      <h3>Así está compuesta tu plata</h3>
      ${renderStackBar(snapshot.activos, snapshot.totales.totalActivos)}
      <div class="legend">${renderLegend(snapshot.activos, snapshot.totales.totalActivos)}</div>
      ${renderHoldingsResumen(snapshot)}

      ${coherenciaHtml}

      <h3>¿Qué tan balanceado está?</h3>
      <div class="arquetipo-card">
        <div class="arquetipo-nombre">${snapshot.arquetipo}</div>
        <p style="margin:0;">${snapshot.mensaje}</p>
      </div>

      <h3>Qué mejorar</h3>
      ${snapshot.tips.map(t => `<div class="tip">${t}</div>`).join("")}

      ${comparativoHtml}

      <button class="btn" onclick="continuarDeBalanceASesion1()">Continuar a mi Rango Objetivo &rarr;</button>
      ${botonVolverPanel("principal")}

      <div class="explorar">
        <h3>Vuelve el próximo mes</h3>
        <p>Este balance vale más si lo repites — es la única forma de ver si tu mezcla realmente está mejorando. Guarda este link y vuelve en un mes.</p>
        <a class="btn" href="${LINK_EXPLORAR}" target="_blank" rel="noopener">Explorar más recursos de Feminario</a>
      </div>
      <div class="footer-nota">Este resultado es educativo, no es asesoría financiera personalizada ni una recomendación de inversión puntual.</div>
    </div>
  `;
}

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
function render(){
  const state = getState();
  if(!state){ pantallaBienvenida(); return; }
  if(!state.perfilRiesgo){ pantallaRiesgo(state); return; }
  if(!state.metas){ pantallaMetas(state); return; }
  if(!state.historial || state.historial.length === 0){ pantallaActivos(state); return; }
  pantallaRetorno(state);
}

/* ============================================================
   MATRIZ DE REFERENCIA — Sesión 1, perfil × horizonte
   ============================================================ */
const MATRIZ = [
  { perfil:"Conservadora", horizonte:"Corto",  rv:[10,20], rf:[50,60], liq:[25,35] },
  { perfil:"Conservadora", horizonte:"Mediano",rv:[20,30], rf:[45,55], liq:[20,25] },
  { perfil:"Conservadora", horizonte:"Largo",  rv:[30,40], rf:[40,45], liq:[15,20] },
  { perfil:"Moderada",     horizonte:"Corto",  rv:[25,35], rf:[40,50], liq:[20,25] },
  { perfil:"Moderada",     horizonte:"Mediano",rv:[40,50], rf:[35,40], liq:[15,20] },
  { perfil:"Moderada",     horizonte:"Largo",  rv:[55,65], rf:[25,30], liq:[10,15] },
  { perfil:"Arriesgada",   horizonte:"Corto",  rv:[40,50], rf:[30,35], liq:[15,20] },
  { perfil:"Arriesgada",   horizonte:"Mediano",rv:[60,70], rf:[20,25], liq:[10,12] },
  { perfil:"Arriesgada",   horizonte:"Largo",  rv:[75,85], rf:[10,15], liq:[5,10] },
];
const HORIZONTES = ["Corto","Mediano","Largo"];
const HORIZONTE_LABEL = { Corto:"Corto (menos de 3 años)", Mediano:"Mediano (3-7 años)", Largo:"Largo (más de 7 años)" };

function bucketHorizonte(metaHorizonte){
  if(metaHorizonte === "Entre 3 y 7 años") return "Mediano";
  if(metaHorizonte === "Más de 7 años") return "Largo";
  return "Corto"; // "Menos de 1 año" y "Entre 1 y 3 años"
}
function filaMatriz(perfil, horizonte){
  return MATRIZ.find(f => f.perfil === perfil && f.horizonte === horizonte);
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function cop(v){ v = Number(v)||0; const signo = v<0?"-":""; return signo + "$" + Math.round(Math.abs(v)).toLocaleString("es-CO"); }
function esc(s){ return (s||"").toString().replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function findPersona(email){
  // Respaldo local: dataset embebido en el momento en que se publicó
  // el artefacto (útil si el Sheet en vivo no responde).
  const key = (email||"").trim().toLowerCase();
  return DATASET.find(p => p.email.trim().toLowerCase() === key) || null;
}
function numOrCero(v){ return (v===""||v===null||v===undefined) ? 0 : Number(v); }
function normalizarPersona(p){
  return {
    nombre: p.nombre || "",
    email: p.email || "",
    perfilRiesgoCategoria: p.perfilRiesgoCategoria || "",
    metaPrincipal: p.metaPrincipal || "",
    metaHorizonte: p.metaHorizonte || "",
    arquetipo: p.arquetipo || "",
    fecha: p.fecha || "",
    activo_liquidez_cop: numOrCero(p.activo_liquidez_cop),
    activo_rentaFija_cop: numOrCero(p.activo_rentaFija_cop),
    activo_mercado_cop: numOrCero(p.activo_mercado_cop),
    activo_pension_cop: numOrCero(p.activo_pension_cop),
    activo_viviendaPropia_cop: numOrCero(p.activo_viviendaPropia_cop),
    activo_viviendaInversion_cop: numOrCero(p.activo_viviendaInversion_cop),
    activo_negocio_cop: numOrCero(p.activo_negocio_cop),
    activo_vehiculo_cop: numOrCero(p.activo_vehiculo_cop),
    activo_otrosActivos_cop: numOrCero(p.activo_otrosActivos_cop),
    totalActivos_cop: numOrCero(p.totalActivos_cop),
    totalPasivos_cop: numOrCero(p.totalPasivos_cop),
    patrimonioNeto_cop: numOrCero(p.patrimonioNeto_cop),
    mesesColchon: numOrCero(p.mesesColchon)
  };
}
async function fetchPersonaLive(email){
  if(!BALANCE_API_URL) return null;
  const url = BALANCE_API_URL + "?email=" + encodeURIComponent(email);
  const res = await fetch(url, { method:"GET" });
  if(!res.ok) return null;
  const data = await res.json();
  if(!data || data.status !== "ok" || !data.found || !data.persona) return null;
  return normalizarPersona(data.persona);
}
function estructuralInvertible(p){
  const estructural = p.activo_viviendaPropia_cop + p.activo_viviendaInversion_cop + p.activo_pension_cop + p.activo_negocio_cop + p.activo_vehiculo_cop + p.activo_otrosActivos_cop;
  const invertible = p.activo_liquidez_cop + p.activo_rentaFija_cop + p.activo_mercado_cop;
  return { estructural, invertible, total: estructural + invertible };
}
function toast(msg){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}
function headerS1(){
  return `<div class="brand"><img src="data:image/png;base64,${ICON_B64}" alt="Feminario"></div>
  <div class="eyebrow">Sesión 1 · Tu Portafolio, Tu Estrategia</div>

}

function pantallaBusquedaS1(mensajeError){

      <input type="email" id="in-email" placeholder="tucorreo@ejemplo.com" value="${sesion.persona ? esc(sesion.persona.email) : ''}">
      ${mensajeError ? `<div class="microcopy" style="background:rgba(178,74,114,0.12); color:var(--alerta);">${mensajeError}</div>` : ""}
      <button class="btn" onclick="buscarPersonaS1()">Buscar mi resultado</button>
      <div class="footer-nota">¿Aún no llenaste tu Balance de Portafolio? <a href="${LINK_BALANCE_PORTAFOLIO}" target="_blank" rel="noopener" style="color:var(--morado);">Hazlo aquí primero</a>, y luego vuelve a esta página.</div>
    </div>
  `;
  document.getElementById("in-email").addEventListener("keydown", e => { if(e.key==="Enter") buscarPersonaS1(); });
}
function pantallaCargandoS1(){
  document.getElementById("app").innerHTML = `
    ${headerS1()}
    <div class="card">
      <p class="lead">Buscando tu resultado…</p>
    </div>
  `;
}
async function buscarPersonaS1(){
  const emailInput = document.getElementById("in-email");
  const email = emailInput ? emailInput.value.trim() : "";
  if(!email){ pantallaBusquedaS1("Escribe tu correo para poder buscar tu resultado 💛"); return; }
  pantallaCargandoS1();
  let persona = null;
  try{
    persona = await fetchPersonaLive(email);
  }catch(err){
    persona = null; // si el Sheet en vivo falla, seguimos con el respaldo local
  }
  if(!persona){
    persona = findPersona(email);
  }
  if(!persona){
    pantallaBusquedaS1("No encontramos un resultado con ese correo. Revisa que esté bien escrito, o completa primero tu Balance de Portafolio.");
    return;
  }
  sesion.persona = persona;
  sesion.horizonte = bucketHorizonte(persona.metaHorizonte);
  sesion.split = estructuralInvertible(persona);
  pantallaResumen();
}

function pantallaSplit(){
  const s = sesion.split;
  const pctInv = s.total > 0 ? Math.round((s.invertible/s.total)*100) : 0;
  const pctEst = 100 - pctInv;
  document.getElementById("app").innerHTML = `
    ${headerS1()}
    <div class="card">
      <h2>Antes de empezar: no toda tu plata entra al ejercicio</h2>
      <p>Separa tu patrimonio en dos partes. El ejercicio de hoy trabaja solo sobre la que sí puedes mover activamente.</p>
      <div class="split-bar">
        ${s.estructural>0 ? `<div class="split-seg" style="width:${pctEst}%; background:var(--morado-suave);">${pctEst}%</div>` : ""}
        ${s.invertible>0 ? `<div class="split-seg" style="width:${pctInv}%; background:var(--morado);">${pctInv}%</div>` : ""}
      </div>
      <div class="split-legend"><span>Estructural</span><span>Invertible activamente</span></div>

      ${progreso(2,4,"Paso 2 de 4 · Estructural vs. invertible")}

  `;
}

function elegirHorizonte(h){

/* ============================================================
   PANTALLA 5 — MATRIZ + RANGO SUGERIDO
   ============================================================ */
function pantallaMatriz(){
  const p = sesion.persona;
  const fila = filaMatriz(p.perfilRiesgoCategoria, sesion.horizonte);
  const mid = (r)=> Math.round((r[0]+r[1])/2);
  // rv y rf se redondean normalmente; liq se calcula como residuo para
  // garantizar que los tres valores por defecto siempre sumen 100%
  // (redondear cada punto medio por separado puede no sumar 100).
  const rvDef = mid(fila.rv), rfDef = mid(fila.rf), liqDef = 100 - rvDef - rfDef;
  document.getElementById("app").innerHTML = `
    ${headerS1()}
    <div class="card">
      <h2>Tu punto de partida — perfil × horizonte</h2>
      <p style="font-size:13.5px; color:var(--texto-suave);">Es un punto de partida, no una fórmula rígida. Tu fila está resaltada abajo.</p>
      <div class="matriz-wrap">
        <table class="matriz">
          <tr><th>Perfil</th><th class="horiz">Horizonte</th><th>R. variable</th><th>R. fija</th><th>Liquidez</th></tr>
          ${MATRIZ.map(f => `
            <tr class="${f.perfil===p.perfilRiesgoCategoria && f.horizonte===sesion.horizonte ? 'fila-activa':''}">
              <td>${f.perfil}</td>
              <td class="horiz">${HORIZONTE_LABEL[f.horizonte]}</td>
              <td>${f.rv[0]}-${f.rv[1]}%</td>
              <td>${f.rf[0]}-${f.rf[1]}%</td>
              <td>${f.liq[0]}-${f.liq[1]}%</td>
            </tr>
          `).join("")}
        </table>
      </div>

      <div class="rango-box">
        <b style="color:var(--morado-oscuro);">Tu rango sugerido:</b> Renta variable ${fila.rv[0]}-${fila.rv[1]}% · Renta fija ${fila.rf[0]}-${fila.rf[1]}% · Liquidez ${fila.liq[0]}-${fila.liq[1]}%
      </div>

      <h3>Así se traduce a tu jardín</h3>
      <div class="jardin-list">
        <div class="jardin-item"><span class="jardin-swatch" style="background:var(--tronco)"></span><span class="jardin-label">Tronco + Ramas</span><span class="jardin-val">= Renta variable</span></div>
        <div class="jardin-item"><span class="jardin-swatch" style="background:var(--raices)"></span><span class="jardin-label">Raíces</span><span class="jardin-val">= Renta fija</span></div>
        <div class="jardin-item"><span class="jardin-swatch" style="background:var(--agua)"></span><span class="jardin-label">Reserva de agua</span><span class="jardin-val">= Liquidez</span></div>
      </div>

      <div class="microcopy">🌱 Tu <b>injerto</b> (cripto, tu propio emprendimiento) también hace parte de tu 100%, y no debería superar el <b>5-10%</b> de tu portafolio total. En el siguiente paso puedes darle un porcentaje.</div>

      <button class="btn" onclick="pantallaFinal(${rvDef}, ${rfDef}, ${liqDef})">Definir mi rango final</button>
      <button class="link-volver" onclick="pantallaHorizonte()">← Volver</button>
      ${botonVolverPanel()}
      ${progreso(4,4,"Paso 4 de 4 · Tu rango de referencia")}
    </div>
  `;
}

  const p = sesion.persona;
  document.getElementById("app").innerHTML = `

        <div><label>Liquidez %</label><input type="number" id="in-liq" value="${liq}" min="0" max="100" oninput="chequearSuma()"></div>
        <div><label>Injerto %</label><input type="number" id="in-injerto" value="${Number(extra.injerto)||0}" min="0" max="100" oninput="chequearSuma()"></div>
      </div>
      <div id="suma-indicador"></div>
      <small class="help">Injerto = cripto o tu emprendimiento propio. Hace parte del 100% y no debería superar 5-10% de tu portafolio total.</small>

      <label>¿Ajustaste algo por tu meta, o te quedaste con lo que decía la matriz? (opcional)</label>
      <textarea id="in-nota" placeholder="Ej: me moví más conservadora porque mi meta está muy cerca...">${esc(extra.nota||"")}</textarea>

      <button class="btn" id="btn-guardar" onclick="guardarRango()">${sesion.editando ? "Guardar cambios" : "Guardar mi rango objetivo"}</button>
      <button class="link-volver" onclick="${sesion.editando ? "sesion.editando=false; pantallaPanel()" : "pantallaMatriz()"}">← Volver</button>
      ${botonVolverPanel()}
    </div>
  `;
  chequearSuma();
}
function chequearSuma(){
  const rv = Number(document.getElementById("in-rv").value)||0;
  const rf = Number(document.getElementById("in-rf").value)||0;
  const liq = Number(document.getElementById("in-liq").value)||0;
  const inj = Number(document.getElementById("in-injerto").value)||0;
  const suma = rv+rf+liq+inj;
  const el = document.getElementById("suma-indicador");
  const btn = document.getElementById("btn-guardar");
  if(suma === 100){
    el.innerHTML = `<div class="suma-check suma-ok">Suma 100% ✓</div>`;
    btn.disabled = false;
  } else {
    el.innerHTML = `<div class="suma-check suma-mal">Suma ${suma}% — ajusta para que dé 100%</div>`;
    btn.disabled = true;
  }
}

   ============================================================ */
function enviarABaseDeDatos(payload){
  if(!SHEET_WEBAPP_URL){ console.log("[Mi Rango Objetivo] Sin SHEET_WEBAPP_URL configurada. Datos no enviados:", payload); return; }
  fetch(SHEET_WEBAPP_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(payload) })
    .catch(err => console.log("[Mi Rango Objetivo] Error al enviar:", err));
}
function guardarRango(){
  const rv = Number(document.getElementById("in-rv").value)||0;
  const rf = Number(document.getElementById("in-rf").value)||0;
  const liq = Number(document.getElementById("in-liq").value)||0;
  const injerto = Number(document.getElementById("in-injerto").value)||0;
  if(rv+rf+liq+injerto !== 100){ toast("Tu rango debe sumar 100% 💛"); return; }
  const nota = document.getElementById("in-nota").value.trim();

  sesion.rango = { rv, rf, liq, injerto, nota };
  const p = sesion.persona;
  const s = sesion.split;

  const payloadRango = {
    tipo: "rango_s1",
    fecha: new Date().toISOString(),
    fechaSesionLabel: FECHA_SESION1_LABEL,
    nombre: p.nombre, email: p.email,
    perfilRiesgo: p.perfilRiesgoCategoria,
    metaPrincipal: p.metaPrincipal, metaHorizonteOriginal: p.metaHorizonte,
    horizonteElegido: sesion.horizonte,
    estructural_cop: s.estructural, invertible_cop: s.invertible, patrimonioNeto_cop: p.patrimonioNeto_cop,
    rango_rentaVariable_pct: rv, rango_rentaFija_pct: rf, rango_liquidez_pct: liq,
    injerto_pct: injerto, injertoDentroDel100: "sí", nota: nota
  };
  enviarABaseDeDatos(payloadRango);
  panelDatos.rango_s1 = Object.assign({}, payloadRango);
  if(sesion.editando){ sesion.editando = false; toast("Cambios guardados ✓"); pantallaPanel(); return; }
  pantallaConfirmacionS1();
}

/* ============================================================
   RADIOGRAFÍA — cómo estoy hoy vs. mi yo ideal
   ============================================================ */
function n0(v){ return Number(v) || 0; }
function mezclaReal(b){
  if(!b) return null;
  const liq = n0(b.activo_liquidez_cop), rf = n0(b.activo_rentaFija_cop), rv = n0(b.activo_mercado_cop);
  const tot = liq + rf + rv; if(tot <= 0) return null;
  const pRv = Math.round(rv/tot*100), pRf = Math.round(rf/tot*100);
  return { rv:pRv, rf:pRf, liq:100 - pRv - pRf, total:tot, cop:{ rv:rv, rf:rf, liq:liq } };
}
function filasRadiografia(b, r, vs){
  const real = mezclaReal(b); if(!real || !r) return null;
  // Lo destinado a vehículos por categoría (ramas cuenta como renta variable)
  const alloc = { tronco:0, raices:0, agua:0, injerto:0 };
  (vs || []).forEach(v => {
    const f = MENU_VEHICULOS.find(x => x.nombre === v.parteJardin); if(!f) return;
    alloc[f.clave === "ramas" ? "tronco" : f.clave] += n0(v.monto_vehiculo_cop);
  });
  const extra = alloc.tronco + alloc.raices + alloc.agua + alloc.injerto;
  const nuevo = real.total + extra;
  const proy = (cop0, a) => extra > 0 ? Math.round((cop0 + a) / nuevo * 100) : null;
  return [
    { k:"Renta variable", parte:"tronco",  real:real.rv,  obj:n0(r.rango_rentaVariable_pct), proy:proy(real.cop.rv, alloc.tronco) },
    { k:"Renta fija",     parte:"raices",  real:real.rf,  obj:n0(r.rango_rentaFija_pct),     proy:proy(real.cop.rf, alloc.raices) },
    { k:"Liquidez",       parte:"agua",    real:real.liq, obj:n0(r.rango_liquidez_pct),      proy:proy(real.cop.liq, alloc.agua) },
    { k:"Injerto",        parte:"injerto", real:0,        obj:n0(r.injerto_pct),             proy:proy(0, alloc.injerto) }
  ].map(x => Object.assign(x, { gap: x.obj - x.real }));
}
function brechaSugerida(restante){
  // restante = true: lo que aún falta DESPUÉS de los vehículos ya elegidos (para sugerir el siguiente)
  const vs = panelDatos.vehiculos_s2 || [];
  const filas = filasRadiografia(panelDatos.balance, sesionV.rango_s1 || panelDatos.rango_s1, restante ? vs : []);
  if(!filas) return null;
  const rest = filas.filter(x => x.parte !== "injerto")
    .map(x => Object.assign({}, x, { falta: x.obj - ((restante && x.proy !== null) ? x.proy : x.real) }))
    .sort((a, b) => b.falta - a.falta);
  const top = rest[0];
  if(!top || top.falta < 1) return null;
  return { clave: top.parte, gap: top.falta, nombre: top.k, conVehiculos: !!(restante && vs.length) };
}
function radiografiaHTML(b, r, vs, opts){
  opts = opts || {};
  const filas = filasRadiografia(b, r, vs);
  if(!filas) return `<div class="microcopy">Aún no tenemos tu balance para comparar tu mezcla de hoy con tu objetivo.</div>`;
  const hayProy = filas.some(x => x.proy !== null);
  return `<div class="rad-leyenda"><span><i class="sw hoy"></i>Hoy</span>${hayProy ? `<span><i class="sw proy"></i>Con mis vehículos</span>` : ""}<span><i class="sw obj"></i>Mi yo ideal</span></div>` +
    filas.map(x => {
      const txt = x.gap >= 3 ? `Te faltan ${x.gap} pts` : x.gap <= -3 ? `Te sobran ${-x.gap} pts` : "En rango ✓";
      const cls = x.gap >= 3 ? "falta" : x.gap <= -3 ? "sobra" : "ok";
      return `<div class="rad-row"><div class="rad-top"><b>${x.k}</b><span>Hoy ${x.real}%${x.proy !== null ? " → " + x.proy + "%" : ""} · Ideal ${x.obj}%</span></div>
        <div class="rad-bar">${x.proy !== null ? `<div class="rad-proy" style="width:${Math.min(100, x.proy)}%"></div>` : ""}<div class="rad-hoy" style="width:${Math.min(100, x.real)}%"></div><div class="rad-obj" style="left:calc(${Math.min(100, x.obj)}% - 1.5px)"></div></div>
        <div class="rad-gap ${cls}">${txt}</div></div>`;
    }).join("") +
    (opts.sinNota ? "" : `<div class="footer-nota">Se calcula sobre lo invertible de tu Balance. Las cripto cuentan dentro de la inversión de mercado.</div>`);
}

/* ============================================================
   GRÁFICOS CIRCULARES (donas)
   ============================================================ */
function copCorto(v){
  v = Number(v) || 0;
  if(v >= 1e9) return "$" + (v / 1e9).toFixed(1).replace(".", ",").replace(",0", "") + " mil M";
  if(v >= 1e6) return "$" + (v / 1e6).toFixed(1).replace(".", ",").replace(",0", "") + " M";
  return cop(v);
}
function donutSVG(partes, centro, anillo){
  const tot = partes.reduce((s, p) => s + (Number(p.v) || 0), 0);
  if(tot <= 0) return "";
  let acum = 0;
  if(!anillo){
    // Gráfico circular (pie chart): círculo completo dividido en porciones
    const segs = partes.filter(p => p.v > 0).map(p => {
      const pct = p.v / tot * 100, dash = Math.max(pct / 2 - 0.3, 0.1), off = 12.5 - acum / 2;
      acum += pct;
      return `<circle cx="21" cy="21" r="7.9577" fill="none" style="stroke:${p.color}" stroke-width="15.9155" stroke-dasharray="${dash} ${50 - dash}" stroke-dashoffset="${off}"></circle>`;
    }).join("");
    return `<svg viewBox="0 0 42 42" class="donut pie" role="img">${segs}</svg>`;
  }
  const segs = partes.filter(p => p.v > 0).map(p => {
    const pct = p.v / tot * 100, dash = Math.max(pct - 0.8, 0.1), off = 25 - acum;
    acum += pct;
    return `<circle cx="21" cy="21" r="15.9155" fill="none" style="stroke:${p.color}" stroke-width="7" stroke-dasharray="${dash} ${100 - dash}" stroke-dashoffset="${off}"></circle>`;
  }).join("");
  return `<svg viewBox="0 0 42 42" class="donut" role="img"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="rgba(126,132,174,0.15)" stroke-width="7"></circle>${segs}</svg>`;
}

      <div class="circ circ-anillo">${donutSVG([{ v:prom, color:"#7E84AE" }, { v:Math.max(4 - prom, 0), color:"rgba(126,132,174,0.18)" }], null, true)}<div class="circ-centro"><div class="circ-v">${prom.toFixed(1).replace(".0", "")}/4</div><div class="circ-k">criterios</div></div></div>

function vectorPct(b, r, vs){
  const real = mezclaReal(b); if(!real || !r) return null;
  const ideal = [n0(r.rango_rentaVariable_pct), n0(r.rango_rentaFija_pct), n0(r.rango_liquidez_pct), n0(r.injerto_pct)];
  const base = [real.cop.rv, real.cop.rf, real.cop.liq, 0];
  const add = [0, 0, 0, 0];
  (vs || []).forEach(v => {
    const f = MENU_VEHICULOS.find(x => x.nombre === v.parteJardin); if(!f) return;
    const k = (f.clave === "ramas" || f.clave === "tronco") ? 0 : f.clave === "raices" ? 1 : f.clave === "agua" ? 2 : 3;
    add[k] += n0(v.monto_vehiculo_cop);
  });
  const pct = arr => { const t = arr.reduce((a, x) => a + x, 0); return t > 0 ? arr.map(x => x / t * 100) : [0, 0, 0, 0]; };
  const hoy = pct(base), despues = pct(base.map((x, i) => x + add[i]));
  const dist = a => a.reduce((s, x, i) => s + Math.abs(ideal[i] - x), 0) / 2;
  return { hoy, despues, ideal, antes: dist(hoy), tras: dist(despues), claves: ["Renta variable", "Renta fija", "Liquidez", "Injerto"] };
}
function cercaniaMeta(b, r, vs){
  const m = vectorPct(b, r, vs); if(!m || m.antes <= 0) return null;
  return Math.max(0, Math.min(100, Math.round((m.antes - m.tras) / m.antes * 100)));
}
function cercaniaMetaHTML(b, r, vs, meta){
  if(!vs || !vs.length) return "";
  const c = cercaniaMeta(b, r, vs); if(c === null) return "";
  return `<div class="meta-prog"><div class="meta-prog-t">Con tus vehículos estás <b>${c}% más cerca</b> de tu yo ideal${meta ? " para llegar a tu meta" : ""}</div><div class="barra-pasos"><div style="width:${c}%"></div></div></div>`;
}
function aporteMetaHTML(b, r, v, meta){
  const m1 = vectorPct(b, r, [v]); if(!m1 || m1.antes <= 0) return "";
  const c = Math.round((m1.antes - m1.tras) / m1.antes * 100);
  const f = MENU_VEHICULOS.find(x => x.nombre === v.parteJardin);
  const idx = !f ? -1 : (f.clave === "ramas" || f.clave === "tronco") ? 0 : f.clave === "raices" ? 1 : f.clave === "agua" ? 2 : 3;
  const det = idx >= 0 ? " " + m1.claves[idx] + ": de " + Math.round(m1.hoy[idx]) + "% a " + Math.round(m1.despues[idx]) + "% (ideal " + m1.ideal[idx] + "%)." : "";
  return c > 0
    ? `<div class="veh-meta">🎯 Esta acción te acerca <b>${c}%</b> a tu yo ideal${meta ? ", el que armaste para «" + esc(meta) + "»" : ""}.${det}</div>`
    : `<div class="veh-meta">🎯 Este aporte no acerca tu mezcla a tu yo ideal: ya tienes suficiente en esta parte.${det}</div>`;
}

function holdingsDe(b){
  const t = b && b.activo_mercado_detalle; if(!t) return [];
  return String(t).split(" · ").map(x => { const m = x.match(/^(.*?) \[(.*?)\]/); return m ? { ticker:m[1].trim(), tipo:m[2].trim() } : null; }).filter(Boolean);
}
function duplicadosMono(hs){
  const g = {};
  hs.forEach(h => { const ix = indiceDe(h.ticker); if(ix) (g[ix] = g[ix] || []).push(h.ticker); });
  return Object.keys(g).filter(k => g[k].length > 1).map(k => g[k].join(" + ") + " siguen lo mismo (" + k + ")");
}

function cargarScript(url){
  return new Promise((ok, mal) => {
    if(document.querySelector('script[src="' + url + '"]')) return ok();
    const s = document.createElement("script"); s.src = url; s.onload = ok; s.onerror = () => mal(new Error("No se pudo cargar " + url));
    document.head.appendChild(s);
  });
}
async function cargarLibsPDF(){
  if(!window.html2canvas) await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if(!(window.jspdf && window.jspdf.jsPDF)) await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
}
async function descargarPDF(){
  const btn = document.getElementById("btn-descargar");
  const textoOriginal = btn ? btn.textContent : "";
  try{
    if(btn){ btn.disabled = true; btn.textContent = "Generando tu PDF…"; }
    await cargarLibsPDF();
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:"mm", format:"a4" });
    const paginas = document.querySelectorAll(".doc-page");
    for(let i = 0; i < paginas.length; i++){
      const el = paginas[i], anterior = el.style.cssText;
      el.style.width = "794px"; el.style.maxWidth = "794px"; el.style.boxShadow = "none"; el.style.borderRadius = "0";
      const canvas = await html2canvas(el, { scale:2, backgroundColor:"#ffffff", useCORS:true, windowWidth:900, ignoreElements: n => n.id === "blobs" });
      el.style.cssText = anterior;
      const maxW = 190, maxH = 277;
      let w = maxW, h = canvas.height * w / canvas.width;
      if(h > maxH){ h = maxH; w = canvas.width * h / canvas.height; }
      if(i > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", (210 - w) / 2, 10, w, h);
    }
    const nombre = ((panelDatos.rango_s1 && panelDatos.rango_s1.nombre) || sesionV.nombre || "").trim().split(/\s+/)[0] || "";
    pdf.save("Mi-Estrategia-de-Inversion" + (nombre ? "-" + nombre : "") + ".pdf");
  }catch(err){
    console.log("[PDF] Error:", err);
    toast("No pudimos generar el PDF. Revisa tu conexión e intenta de nuevo 💛");
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = textoOriginal; }
  }
}

function cop(v){ v = Number(v)||0; const signo = v<0?"-":""; return signo + "$" + Math.round(Math.abs(v)).toLocaleString("es-CO"); }
function esc(s){ return (s||"").toString().replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function toast(msg){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}

  let dots = "";

  return `<div class="progreso"><div class="paso-dots">${dots}</div><div class="paso-texto">${texto||""}</div></div>`;
}

function guardarVehiculo(){
  const vehiculo = document.getElementById("in-vehiculo").value.trim();
  const monto = Number(document.getElementById("in-monto").value)||0;
  const cuando = document.getElementById("in-cuando").value.trim();
  const fechaIso = document.getElementById("in-fecha").value;
  const fechaAporte = fechaIso ? fechaEnTexto(new Date(fechaIso + "T00:00:00")) : "";
  if(!vehiculo){ toast("Escribe el vehículo que elegiste 💛"); return; }
  if(!cuando){ toast("Cuéntanos cuándo lo vas a abrir o aportar 💛"); return; }
  const yaTenia = document.getElementById("in-yatenia").checked;
  const queTenia = document.getElementById("in-quetenia").value.trim();
  const nota = document.getElementById("in-nota").value.trim();
  const criterios = Array.from(document.querySelectorAll(".crit-chk:checked")).map(x => x.value).join("; ");
  const porQue = document.getElementById("in-porque").value.trim();
  const primerPaso = document.getElementById("in-primerpaso").value.trim();
  const aprenderTxt = document.getElementById("in-aprender").value.trim();
  const quiereAprender = Array.from(document.querySelectorAll(".ap-chk:checked")).map(x => x.value).concat(aprenderTxt ? [aprenderTxt] : []).join("; ");

  const f = filaMenu(sesionV.brecha);
  const ed = vehiculoEditando;
  sesionV.vehiculo = { vehiculo, monto, cuando, yaTenia, queTenia, nota };

  const registro = {
    id: nuevoId(),
    tipo: ed ? "vehiculo_s2_editar" : "vehiculo_s2",
    fecha: new Date().toISOString(),
    fechaSesionLabel: FECHA_SESION2_LABEL,
    nombre: sesionV.nombre, email: sesionV.email,
    parteJardin: f.nombre,
    vehiculoElegido: vehiculo,
    monto_vehiculo_cop: monto,
    cuandoAportar: cuando,
    fechaAporte: fechaAporte,
    yaTeniaEnEstaParte: yaTenia ? "sí" : "no",
    queTeniaYa: queTenia,
    nota: nota,
    criterios: criterios,
    porQueCumple: porQue,
    primerPaso: primerPaso,
    monoCultivo: sesionV.mono || (ed && ed.monoCultivo) || "",
    quiereAprender: quiereAprender,
    tipoVehiculo: (sesionV.catalogoElegido && sesionV.catalogoElegido.n) || (ed && ed.tipoVehiculo) || ""
  };
  if(ed) registro.idAnterior = ed.id;
  enviarABaseDeDatos(registro);

  const lista = panelDatos.vehiculos_s2;
  if(ed){
    const i = lista.findIndex(x => x.id === ed.id);
    if(i >= 0) lista[i] = registro; else lista.push(registro);
    vehiculoEditando = null;
    toast("Cambios guardados ✓");
    pantallaPanel();
    return;
  }
  lista.push(registro);
  sesionV.catalogoElegido = null;
  pantallaConfirmacionS2();
}

function editarVehiculo(id){
  const v = panelDatos.vehiculos_s2.find(x => x.id === id);
  if(!v) return;
  const fila = MENU_VEHICULOS.find(f => f.nombre === v.parteJardin);
  vehiculoEditando = v;
  sesionV.brecha = fila ? fila.clave : null;
  if(fila) pantallaVehiculo(); else pantallaBrecha();
}
function quitarVehiculo(id){
  if(!confirm("¿Seguro que quieres quitar este vehículo de tu lista?")) return;

/* ---- Fechas y cuenta regresiva ---- */
const MESES_ES = { enero:0, febrero:1, marzo:2, abril:3, mayo:4, junio:5, julio:6, agosto:7, septiembre:8, setiembre:8, octubre:9, noviembre:10, diciembre:11 };
const NOMBRES_MES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const FECHA_SESION3 = new Date(2026, 9, 29);
function hoyLocal(){ const h = new Date(); h.setHours(0,0,0,0); return h; }
function diasHasta(d){ const f = new Date(d); f.setHours(0,0,0,0); return Math.round((f - hoyLocal()) / 86400000); }
function textoDias(n){ return n === 0 ? "hoy" : n === 1 ? "mañana" : n > 1 ? "en " + n + " días" : "hace " + (-n) + " días"; }
function fechaEnTexto(d){ return d.getDate() + " de " + NOMBRES_MES[d.getMonth()] + " de " + d.getFullYear(); }
function fechaDeTexto(texto){
  const t = String(texto || "").toLowerCase();
  const m = t.match(/(\d{1,2})\s+de\s+([a-záéíóú]+)(?:\s+(?:de\s+)?(\d{4}))?/);
  if(m && MESES_ES[m[2]] !== undefined){
    const hoy = hoyLocal();
    let y = m[3] ? Number(m[3]) : hoy.getFullYear();
    let d = new Date(y, MESES_ES[m[2]], Number(m[1]));
    if(!m[3] && d < hoy) d = new Date(y + 1, MESES_ES[m[2]], Number(m[1]));
    return d;
  }
  const hoy = hoyLocal();
  if(/\bhoy\b/.test(t)) return hoy;
  if(/mañana/.test(t)) return new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + 1);
  if(/esta semana/.test(t)){ const f = new Date(hoy); f.setDate(hoy.getDate() + ((7 - hoy.getDay()) % 7)); return f; }
  if(/fin de(l)? mes|final del mes/.test(t)) return new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);
  return null;
}
function fechaDeVehiculo(v){ return fechaDeTexto(v.fechaAporte) || fechaDeTexto(v.cuandoAportar); }
function aISO(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function plazoMeta(horizonte, desde){
  const t = String(horizonte || "");
  const anios = /menos de 1/i.test(t) ? 1 : /1 y 3/.test(t) ? 3 : /3 y 7/.test(t) ? 7 : null;
  const base = new Date(desde); if(!anios || isNaN(base)) return "";
  const fin = new Date(base); fin.setFullYear(base.getFullYear() + anios);
  const dias = diasHasta(fin);
  if(dias <= 0) return "";
  return dias < 365 ? "~" + Math.max(1, Math.round(dias / 30)) + " meses" : "~" + (dias / 365).toFixed(1).replace(".0", "") + " años";
}

  const kpiHTML = `<div class="kpi-grid">${kpiLista.map(k => `<div class="kpi"><div class="kpi-k kpi-top">${esc(k[1])}</div><div class="kpi-v">${esc(k[0])}</div><div class="kpi-k">${esc(k[2])}</div></div>`).join("")}</div>`;
