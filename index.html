    </div>` : "";
  const cardRango = r ? `
    <div class="vehiculo-card compacta">
      <div class="comp-fila"><div><h3>Mi yo ideal ✓</h3><div class="detalle-v">${n0(r.rango_rentaVariable_pct)}% renta variable · ${n0(r.rango_rentaFija_pct)}% renta fija · ${n0(r.rango_liquidez_pct)}% liquidez · ${n0(r.injerto_pct)}% injerto</div></div>
      <button class="btn-mini" onclick="editarRango()">Editar</button></div>
    </div>` : "";

  const cardVehiculos = vs.length ? `
    <div class="vehiculo-card">
      <h3>Mis vehículos ✓</h3>
      ${vehiculosCirculos(vs, proximo)}
      ${vs.map(v => {
        const d = fechaDeVehiculo(v);
        const cumple = (v.criterios || "").split(";").filter(x => x.trim()).length;
        return `
        <div class="veh-item">
          <div class="veh-top"><b>${esc(v.vehiculoElegido || "")}</b><span>${cop(v.monto_vehiculo_cop)}</span></div>
          <div class="veh-parte">${esc(v.parteJardin || "")}${cumple ? " · cumple " + cumple + " de 4 criterios" : ""}</div>
          ${(v.cuandoAportar || d) ? `<div class="veh-det">📅 ${esc(d ? fechaEnTexto(d) : v.cuandoAportar)}${d ? " · " + textoDias(diasHasta(d)) : ""}</div>` : ""}
          ${v.primerPaso ? `<div class="veh-det">👣 Esta semana: ${esc(v.primerPaso)}</div>` : ""}
          ${v.porQueCumple ? `<div class="veh-det">💬 ${esc(v.porQueCumple)}</div>` : ""}
          ${aporteMetaHTML(b, r, v, meta)}
          <div class="panel-acciones">
            <button class="btn-mini" onclick="editarVehiculo('${esc(v.id)}')">Editar</button>
            <button class="btn-mini peligro" onclick="quitarVehiculo('${esc(v.id)}')">Quitar</button>
          </div>
        </div>`; }).join("")}
      <div class="panel-acciones"><button class="btn-mini" onclick="elegirOtroVehiculo()">+ Agregar otro vehículo</button></div>
    </div>` : "";

  const cardEstilo = est ? `
    <div class="vehiculo-card compacta">
      <div class="comp-fila"><div><h3>Mi estilo de decisión ✓</h3><div class="detalle-v">${esc(est.estiloElegido || "")}${est.estiloMezcla ? " + " + esc(est.estiloMezcla) : ""}</div>${est.porque ? `<div class="detalle-v">💬 ${esc(est.porque)}</div>` : ""}</div>
      <button class="btn-mini" onclick="empezarSesion3()">Editar</button></div>
    </div>` : "";

  const botonEntregable = todoCompleto() ? `<button class="btn" onclick="pantallaEntregable()">Ver y descargar mi hoja de estrategia (PDF)</button>` : "";

  let siguiente = "";
  if(b && !r){
    siguiente = `<div class="paso-sig">Siguiente paso: tu Rango Objetivo.</div>
      <button class="btn" onclick="continuarARangoDesdePanel()">Continuar a mi Rango Objetivo &rarr;</button>`;
  } else if(r && !vs.length){
    siguiente = `<div class="paso-sig">Siguiente paso: elegir tu vehículo.</div>
      <button class="btn" onclick="elegirOtroVehiculo()">Continuar a elegir mi vehículo &rarr;</button>`;
  } else if(vs.length && !est){
    siguiente = `<div class="paso-sig">Siguiente paso: tu estilo de decisión (Sesión 3).</div>
      <button class="btn" onclick="empezarSesion3()">Continuar a mi estilo de decisión &rarr;</button>`;
  } else if(!b && !r && !vs.length){
    siguiente = `<button class="btn" onclick="pantallaBienvenidaConEmail(emailOrquestador)">Empezar con mi Balance de Portafolio</button>`;
  }

  document.getElementById("app").innerHTML = `
    ${headerOrquestador("Tu Estrategia")}
    <div class="card">
      <p class="lead">Hola${nombre ? ", " + esc(nombre) : ""} 👋 Así va tu Estrategia de Inversión.</p>
      ${avance}
      ${cardMeta}
      ${cardHito}
      ${kpiHTML}
      ${cardPatrimonio}
      ${cardRadiografia}
      ${cardVehiculos}
      ${cardEstilo}
      ${cardRango}${cardBalance}
      ${botonEntregable}
      ${siguiente}
      <button class="link-volver" onclick="pantallaInicioUnificado()">← Usar otro correo</button>
    </div>
  `;
}
function actualizarBalance(){ desdePanelEdicion = true; ultimoSnapshotGuardado = null; pantallaBienvenidaConEmail(emailOrquestador); }
function continuarARangoDesdePanel(){
  desdePanelEdicion = true;
  const persona = normalizarPersona(panelDatos.balance);
  sesion.persona = persona;
  sesion.horizonte = bucketHorizonte(persona.metaHorizonte);
  sesion.split = estructuralInvertible(persona);
  pantallaResumen();
}
function editarRango(){
  const r = panelDatos.rango_s1, b = panelDatos.balance || {};
  sesion.persona = normalizarPersona({
    nombre: r.nombre || b.nombre, email: r.email || emailOrquestador,
    perfilRiesgoCategoria: r.perfilRiesgo || r.perfilRiesgoCategoria || b.perfilRiesgoCategoria,
    metaPrincipal: r.metaPrincipal || b.metaPrincipal,
    metaHorizonte: r.metaHorizonteOriginal || b.metaHorizonte,
    patrimonioNeto_cop: r.patrimonioNeto_cop || b.patrimonioNeto_cop, fecha: r.fecha
  });
  sesion.horizonte = r.horizonteElegido || bucketHorizonte(sesion.persona.metaHorizonte);
  const est = numOrCero(r.estructural_cop), inv = numOrCero(r.invertible_cop);
  sesion.split = { estructural: est, invertible: inv, total: est + inv };
  sesion.editando = true;
  let rv = numOrCero(r.rango_rentaVariable_pct), rf = numOrCero(r.rango_rentaFija_pct), liq = numOrCero(r.rango_liquidez_pct);
  const inj = numOrCero(r.injerto_pct);
  if(rv + rf + liq + inj !== 100 && rv + rf + liq > 0){
    // Rango guardado cuando el injerto iba aparte del 100%: lo reacomodamos para que todo sume 100
    const f = (100 - inj) / (rv + rf + liq);
    rv = Math.round(rv * f); rf = Math.round(rf * f); liq = 100 - inj - rv - rf;
  }
  pantallaFinal(rv, rf, liq, { injerto: inj, nota: r.nota });
}

/* Puentes entre secciones (evitan re-consultar el Sheet con datos que ya están en memoria) */
function continuarDeBalanceASesion1(){
  const state = getState();
  const snapshot = state.historial[state.historial.length-1];
  const coherencia = evaluarCoherencia(state.perfilRiesgo, state.metas, snapshot.activos, snapshot.totales.totalActivos);
  const payload = construirPayloadPlano(state, snapshot, coherencia);
  panelDatos.balance = payload;
  const persona = normalizarPersona(payload);
  sesion.persona = persona;
  sesion.horizonte = bucketHorizonte(persona.metaHorizonte);
  sesion.split = estructuralInvertible(persona);
  pantallaResumen();
}
function continuarDeSesion1ASesion2(){
  const p = sesion.persona, r = sesion.rango;
  sesionV.email = p.email;
  sesionV.nombre = p.nombre;
  sesionV.rango_s1 = {
    nombre: p.nombre, horizonteElegido: sesion.horizonte,
    rango_rentaVariable_pct: r.rv, rango_rentaFija_pct: r.rf, rango_liquidez_pct: r.liq, injerto_pct: r.injerto
  };
  sesionV.desdePanel = false;
  pantallaBrecha();
}

pantallaInicioUnificado();
